name: Bug report
description: Report a bug in Termalogy
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is the bug?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, .NET SDK, app version
